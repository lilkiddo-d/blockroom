[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
dynamic_test_linking = false
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "../app/src/generated" },
  { access = "read", path = "./script" },
  { access = "read", path = "../config" },
  { access = "read", path = "./out" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
anvil = "http://127.0.0.1:8545"

# Robinhood Chain uses Blockscout. Source: https://docs.robinhood.com/chain/deploy-smart-contracts
[etherscan]
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[profile.nooptim]
optimizer = false
